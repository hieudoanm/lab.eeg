# Cloud Build Configuration for EEG Lab CI/CD
#
# Triggers:
# - Push to main → deploy to dev
# - Tag (v*) → deploy to prod
#
# Required IAM roles for Cloud Build service account:
# - Cloud Run Admin
# - Cloud Run Service Agent
# - Service Account User
# - Storage Admin
# - Artifact Registry Writer
# - Secret Manager Secret Accessor
# - Cloud SQL Client
# - Cloud Scheduler Admin
# - Monitoring Admin
# - Logging Admin

steps:
  # ---------------------------------------------------------------------------
  # Build and push Docker images
  # ---------------------------------------------------------------------------

  # Build API image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-api:$COMMIT_SHA',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-api:latest',
        '-f',
        'packages/backend/Dockerfile',
        'packages/backend'
      ]
    env:
      - 'DOCKER_BUILDKIT=1'

  # Build Worker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-worker:$COMMIT_SHA',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-worker:latest',
        '-f',
        'packages/backend/Dockerfile.worker',
        'packages/backend'
      ]
    env:
      - 'DOCKER_BUILDKIT=1'

  # Build Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-frontend:$COMMIT_SHA',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-frontend:latest',
        '-f',
        'packages/frontend/Dockerfile',
        'packages/frontend'
      ]
    env:
      - 'DOCKER_BUILDKIT=1'

  # Build Dispatcher image (same as worker but different entrypoint)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dispatcher'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-dispatcher:$COMMIT_SHA',
        '-t',
        'gcr.io/$PROJECT_ID/eeg-lab-dispatcher:latest',
        '-f',
        'packages/backend/Dockerfile.dispatcher',
        'packages/backend'
      ]
    env:
      - 'DOCKER_BUILDKIT=1'

  # Push all images
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/eeg-lab-api:$COMMIT_SHA',
        'gcr.io/$PROJECT_ID/eeg-lab-api:latest',
        'gcr.io/$PROJECT_ID/eeg-lab-worker:$COMMIT_SHA',
        'gcr.io/$PROJECT_ID/eeg-lab-worker:latest',
        'gcr.io/$PROJECT_ID/eeg-lab-frontend:$COMMIT_SHA',
        'gcr.io/$PROJECT_ID/eeg-lab-frontend:latest',
        'gcr.io/$PROJECT_ID/eeg-lab-dispatcher:$COMMIT_SHA',
        'gcr.io/$PROJECT_ID/eeg-lab-dispatcher:latest'
      ]

  # ---------------------------------------------------------------------------
  # Run tests in Cloud Build (optional, also run in GitHub Actions)
  # ---------------------------------------------------------------------------

  # Backend tests
  - name: 'python:3.15-slim'
    id: 'backend-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd packages/backend
        pip install -q uv
        uv sync --all-groups
        uv run pytest -q

  # Frontend tests
  - name: 'node:26.13.0-slim'
    id: 'frontend-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd packages/frontend
        corepack enable
        pnpm install --frozen-lockfile
        pnpm test

  # ---------------------------------------------------------------------------
  # Deploy Terraform (dev environment on master branch)
  # ---------------------------------------------------------------------------

  - name: 'hashicorp/terraform:1.17'
    id: 'terraform-dev-plan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd infrastructure/terraform/environments/dev
        terraform init
        terraform plan \
          -var="project_id=$PROJECT_ID" \
          -var="project_number=$PROJECT_NUMBER" \
          -var="auth_token_secret=$_AUTH_TOKEN_SECRET" \
          -var="db_password=$_DB_PASSWORD" \
          -var="redis_auth=$_REDIS_AUTH" \
          -var="api_image=gcr.io/$PROJECT_ID/eeg-lab-api:$COMMIT_SHA" \
          -var="worker_image=gcr.io/$PROJECT_ID/eeg-lab-worker:$COMMIT_SHA" \
          -var="frontend_image=gcr.io/$PROJECT_ID/eeg-lab-frontend:$COMMIT_SHA" \
          -var="dispatcher_image=gcr.io/$PROJECT_ID/eeg-lab-dispatcher:$COMMIT_SHA" \
          -out=tfplan
    secretEnv: ['AUTH_TOKEN_SECRET', 'DB_PASSWORD', 'REDIS_AUTH']
    waitFor: ['push-images', 'backend-tests', 'frontend-tests']

  - name: 'hashicorp/terraform:1.17'
    id: 'terraform-dev-apply'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd infrastructure/terraform/environments/dev
        terraform apply -auto-approve tfplan
    waitFor: ['terraform-dev-plan']

  # ---------------------------------------------------------------------------
  # Deploy Terraform (prod environment on tags)
  # ---------------------------------------------------------------------------

  - name: 'hashicorp/terraform:1.17'
    id: 'terraform-prod-plan'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd infrastructure/terraform/environments/prod
        terraform init
        terraform plan \
          -var="project_id=$PROJECT_ID" \
          -var="project_number=$PROJECT_NUMBER" \
          -var="auth_token_secret=$_AUTH_TOKEN_SECRET" \
          -var="db_password=$_DB_PASSWORD" \
          -var="redis_auth=$_REDIS_AUTH" \
          -var="oidc_client_secret=$_OIDC_CLIENT_SECRET" \
          -var="api_image=gcr.io/$PROJECT_ID/eeg-lab-api:$COMMIT_SHA" \
          -var="worker_image=gcr.io/$PROJECT_ID/eeg-lab-worker:$COMMIT_SHA" \
          -var="frontend_image=gcr.io/$PROJECT_ID/eeg-lab-frontend:$COMMIT_SHA" \
          -var="dispatcher_image=gcr.io/$PROJECT_ID/eeg-lab-dispatcher:$COMMIT_SHA" \
          -out=tfplan
    secretEnv:
      ['AUTH_TOKEN_SECRET', 'DB_PASSWORD', 'REDIS_AUTH', 'OIDC_CLIENT_SECRET']
    waitFor: ['push-images', 'backend-tests', 'frontend-tests']

  - name: 'hashicorp/terraform:1.17'
    id: 'terraform-prod-apply'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd infrastructure/terraform/environments/prod
        terraform apply -auto-approve tfplan
    waitFor: ['terraform-prod-plan']

  # ---------------------------------------------------------------------------
  # Run database migrations (after dev deploy)
  # ---------------------------------------------------------------------------

  - name: 'gcr.io/$PROJECT_ID/eeg-lab-api:$COMMIT_SHA'
    id: 'run-migrations-dev'
    entrypoint: 'uv'
    args: ['run', 'python', '-m', 'app.db.migrations', 'upgrade']
    env:
      - 'DATABASE_URL=postgresql://eeg-lab@/eeg-lab?host=/cloudsql/$PROJECT_ID:us-central1:eeg-lab-dev-db'
      - 'APP_ENV=dev'
      - 'AUTH_MODE=development'
    waitFor: ['terraform-dev-apply']

  # ---------------------------------------------------------------------------
  # Smoke tests against deployed dev environment
  # ---------------------------------------------------------------------------

  - name: 'python:3.15-slim'
    id: 'smoke-tests-dev'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd packages/backend
        pip install -q uv
        uv sync --all-groups
        NEUROLAB_E2E_API_BASE=https://$(gcloud run services describe eeg-lab-dev-api --region=us-central1 --format='value(status.url)')/api/v1 \
        uv run pytest -q e2e/analysis-workflow.spec.ts
    waitFor: ['run-migrations-dev']

# ---------------------------------------------------------------------------
# Substitutions and secrets
# ---------------------------------------------------------------------------

substitutions:
  _AUTH_TOKEN_SECRET: ''
  _DB_PASSWORD: ''
  _REDIS_AUTH: ''
  _OIDC_CLIENT_SECRET: ''

secrets:
  - kmsKeyName: projects/$PROJECT_ID/locations/global/keyRings/eeg-lab/cryptoKeys/cloudbuild-secrets
    secretEnv:
      AUTH_TOKEN_SECRET: projects/$PROJECT_ID/secrets/eeg-lab-dev-auth-token-secret/versions/latest
      DB_PASSWORD: projects/$PROJECT_ID/secrets/eeg-lab-dev-db-password/versions/latest
      REDIS_AUTH: projects/$PROJECT_ID/secrets/eeg-lab-dev-redis-auth/versions/latest
      OIDC_CLIENT_SECRET: projects/$PROJECT_ID/secrets/eeg-lab-prod-oidc-client-secret/versions/latest

# ---------------------------------------------------------------------------
# Options
# ---------------------------------------------------------------------------

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  pool:
    name: 'projects/$PROJECT_ID/locations/us-central1/workerPools/eeg-lab-build-pool'

timeout: '3600s'
