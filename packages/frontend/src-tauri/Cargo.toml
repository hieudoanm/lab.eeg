[package]
name = "eeg-lab"
version = "0.1.0"
description = "EEG Lab - Neuroscience research platform for EEG studies, datasets, and descriptive analyses"
authors = ["EEG Lab Contributors"]
license = "MIT"
repository = "https://github.com/hieudoanm/eeg-lab"
edition = "2024"
rust-version = "1.90"

[lib]
name = "eeg_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.34"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-shell = "=2.6.0"
tauri-plugin-fs = "=2.7.1"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-notification = "=2.8.0"
tokio = { version = "=1.54.1", features = ["full"] }
axum = "=0.8.9"
tower-http = { version = "=0.7.1", features = ["fs"] }
mime_guess = "=2.0.5"
