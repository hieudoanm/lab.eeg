[project]
name = "eeg-lab-api"
version = "0.1.0"
description = "EEG Lab REST API and background analysis worker"
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "celery[redis]==5.6.3",
    "fastapi==0.162.0",
    "numpy==2.5.4",
    "prometheus-client==0.26.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pyjwt==2.15.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "C4",
    "RET",
    "PTH",
]
ignore = [
    "B008",
    "SIM108",
    "RET504",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM117", "PTH"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.analysis_tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL instance",
    "security: exercises authorisation and tenant isolation",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/workers/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
