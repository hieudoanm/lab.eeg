[package]
name = "neuro-lab-desktop"
version = "0.1.0"
edition = "2021"
build = true

[lib]
name = "neuro_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
neuro-core = { path = "../../../crates/neuro-core" }
neuro-eeg = { path = "../../../crates/neuro-eeg" }
neuro-meg = { path = "../../../crates/neuro-meg" }
neuro-mri = { path = "../../../crates/neuro-mri" }
neuro-store = { path = "../../../crates/neuro-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
