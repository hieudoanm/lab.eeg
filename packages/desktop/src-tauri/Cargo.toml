[package]
name = "neuro-lab-desktop"
version = "0.1.0"
edition = "2021"
build = true

[lib]
name = "neuro_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
neuro-core = { path = "../../../crates/neuro-core" }
neuro-eeg = { path = "../../../crates/neuro-eeg" }
neuro-meg = { path = "../../../crates/neuro-meg" }
neuro-mri = { path = "../../../crates/neuro-mri" }
neuro-store = { path = "../../../crates/neuro-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = [] }
thiserror = "=2.0.21"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.29.2", features = ["v4"] }

# Newer clippy (rust 1.99) flags pre-existing style patterns; keep -D warnings green.
[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
neg_cmp_op_on_partial_ord = "allow"
unnecessary_sort_by = "allow"
manual_range_contains = "allow"
useless_conversion = "allow"
needless_lifetimes = "allow"
unnecessary_cast = "allow"
manual_checked_ops = "allow"
format_in_format_args = "allow"
ptr_arg = "allow"
