          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        archived_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - description
      - status
      - created_at
      - updated_at
      title: StudyRead
      description: Study representation returned to API clients.
    StudyStatus:
      type: string
      enum:
      - active
      - archived
      title: StudyStatus
      description: Lifecycle states for a study.
    StudyUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      title: StudyUpdateRequest
      description: Partial update of a study.
    UploadFinaliseResponse:
      properties:
        upload_session_id:
          type: string
          format: uuid
          title: Upload Session Id
        upload_method:
          type: string
          const: backend
          title: Upload Method
          default: backend
        dataset:
          $ref: '#/components/schemas/DatasetRead'
        status:
          $ref: '#/components/schemas/UploadSessionStatus'
      additionalProperties: false
      type: object
      required:
      - upload_session_id
      - dataset
      - status
      title: UploadFinaliseResponse
      description: 'Result of a finalisation request.


        Validation runs synchronously in Phase 5 (the background worker arrives in

        Phase 6), so the dataset is returned in its final state.'
    UploadManifest:
      properties:
        sampling_frequency_hz:
          type: number
          exclusiveMinimum: 0.0
          title: Sampling Frequency Hz
        channel_names:
          items:
            type: string
          type: array
          maxItems: 256
          minItems: 1
          title: Channel Names
        channel_units:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 256
          - type: 'null'
          title: Channel Units
      additionalProperties: false
      type: object
      required:
      - sampling_frequency_hz
      - channel_names
      title: UploadManifest
      description: 'Metadata supplied with the recording and verified against the array.


        The ``.npy`` array embeds no sampling frequency or channel labels, so the

        manifest is the authoritative source for these values; validation rejects a

        manifest that does not match the array''s first dimension.'
    UploadSessionCreateRequest:
      properties:
        file_name:
          type: string
          maxLength: 255
          minLength: 1
          title: File Name
        file_size_bytes:
          type: integer
          minimum: 1.0
          title: File Size Bytes
        format:
          $ref: '#/components/schemas/DatasetFormat'
          default: npy
        expected_checksum_sha256:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 64
          - type: 'null'
          title: Expected Checksum Sha256
        manifest:
          $ref: '#/components/schemas/UploadManifest'
      additionalProperties: false
      type: object
      required:
      - file_name
      - file_size_bytes
      - manifest
      title: UploadSessionCreateRequest
      description: Create an upload session for a registered dataset.
    UploadSessionRead:
      properties:
        upload_session_id:
          type: string
          format: uuid
          title: Upload Session Id
        status:
          $ref: '#/components/schemas/UploadSessionStatus'
        upload_method:
          type: string
          enum:
          - backend
        upload_url:
          type: string
          title: Upload Url
        expires_at:
          type: string
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - upload_session_id
      - status
      - upload_method
      - upload_url
      - expires_at
      title: UploadSessionRead
      description: 'An upload session handed to the client.


        For the local ``backend`` method, ``upload_url`` is a relative path on the

        same API host; the caller authenticates as it does for any other request.'
    UploadSessionStatus:
      type: string
      enum:
      - created
      - uploading
      - uploaded
      - finalising
      - completed
      - failed
      - expired
      title: UploadSessionStatus
      description: Lifecycle states for an upload session.
    ErrorDetailModel:
      type: object
      properties:
        field:
          anyOf:
          - type: string
          - type: 'null'
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      title: ErrorDetailModel
    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable message safe for display
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailModel'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - code
      - message
      - details
      title: ErrorBody
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
      title: ErrorResponse
    AnalysesByStatus:
      properties:
        queued:
          type: integer
          title: Queued
          default: 0
        running:
          type: integer
          title: Running
          default: 0
        succeeded:
          type: integer
          title: Succeeded
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        cancelled:
          type: integer
          title: Cancelled
          default: 0
      additionalProperties: false
      type: object
      title: AnalysesByStatus
      description: Analysis job counts grouped by lifecycle status.
    OrganisationSummaryRead:
      properties:
        study_count:
          type: integer
          title: Study Count
        active_study_count:
          type: integer
          title: Active Study Count
        dataset_count:
          type: integer
          title: Dataset Count
        ready_dataset_count:
          type: integer
          title: Ready Dataset Count
        analysis_count:
          type: integer
          title: Analysis Count
        analyses_by_status:
          $ref: '#/components/schemas/AnalysesByStatus'
      additionalProperties: false
      type: object
      required:
      - study_count
      - active_study_count
      - dataset_count
      - ready_dataset_count
      - analysis_count
      - analyses_by_status
      title: OrganisationSummaryRead
      description: Aggregate counts for an organisation's dashboard.
    SignalChannelRead:
      properties:
        channel_index:
          type: integer
          title: Channel Index
        channel_name:
          type: string
          title: Channel Name
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        samples:
          items:
            anyOf:
            - type: number
            - type: 'null'
          type: array
          title: Samples
      additionalProperties: false
      type: object
      required:
      - channel_index
      - channel_name
      - samples
      title: SignalChannelRead
      description: A decimated channel signal within a requested window.
    SignalWindowRead:
      properties:
        dataset_id:
          type: string
          format: uuid
          title: Dataset Id
        sampling_frequency_hz:
          type: number
          title: Sampling Frequency Hz
        channel_count:
          type: integer
          title: Channel Count
        sample_count:
          type: integer
          title: Sample Count
        duration_seconds:
          type: number
          title: Duration Seconds
        start_seconds:
          type: number
          title: Start Seconds
        end_seconds:
          type: number
          title: End Seconds
        sample_start:
          type: integer
          title: Sample Start
        sample_end:
          type: integer
          title: Sample End
        channel_indices:
          items:
            type: integer
          type: array
          title: Channel Indices
        points_per_channel:
          type: integer
          title: Points Per Channel
        downsampled:
          type: boolean
          title: Downsampled
        downsample_factor:
          type: integer
          title: Downsample Factor
        time_seconds:
          items:
            type: number
          type: array
          title: Time Seconds
        channels:
          items:
            $ref: '#/components/schemas/SignalChannelRead'
          type: array
          title: Channels
      additionalProperties: false
      type: object
      required:
      - dataset_id
      - sampling_frequency_hz
      - channel_count
      - sample_count
      - duration_seconds
      - start_seconds
      - end_seconds
      - sample_start
      - sample_end
      - channel_indices
      - points_per_channel
      - downsampled
      - downsample_factor
      - time_seconds
      - channels
      title: SignalWindowRead
      description: 'A bounded, decimated slice of a recording for display.


        ``samples`` align with ``time_seconds``; non-finite samples are reported as

        ``null`` so a chart renders a gap, and ``downsampled`` records whether the

        samples were decimated for transport.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed access token supplied in the Authorization header.
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: eeg-lab_session
      description: HttpOnly session cookie; name defaults to eeg-lab_session and is configurable.
  headers:
    RequestId:
      description: Request correlation identifier.
      schema:
        type: string
    WwwAuthenticate:
      description: Authentication challenge returned with 401 responses.
      schema:
        type: string
        example: Bearer
    SetCookie:
      description: HttpOnly session cookie set or expired by the authentication endpoint.
      schema:
        type: string
servers:
- url: http://localhost:8000
  description: Local development; production host is deployment-configured.
tags:
- name: authentication
  description: Development token issuance and session sign-out.
- name: identity
  description: Authenticated user profile and organisation memberships.
- name: organisations
  description: Organisation and membership management.
- name: studies
  description: Organisation-scoped research studies.
- name: datasets
  description: Dataset registration and metadata.
- name: uploads
  description: Backend-mediated recording uploads and validation.
- name: analyses
  description: Asynchronous analyses, status, results, and cancellation.
- name: health
  description: Unauthenticated liveness and readiness probes.
- name: observability
  description: Prometheus metrics for trusted monitoring systems.
