openapi: 3.1.0
info:
  title: EEG Lab API
  description: REST API for organising neuroscience studies, EEG recordings, and reproducible descriptive
    analyses. Research software demonstration only.
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Liveness probe
      description: Reports whether the API process is alive. Never checks dependencies.
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '500':
          description: Unexpected server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '413':
          description: The request body exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
      parameters: []
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness probe
      description: Reports whether required dependencies are available. Exposes no secrets.
      operationId: ready_health_ready_get
