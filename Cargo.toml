[workspace]
members = [
  "crates/neuro-core",
  "crates/neuro-eeg",
  "crates/neuro-meg",
  "crates/neuro-mri",
  "crates/neuro-store",
  "packages/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
chrono = { version = "=0.4.45", features = ["serde"] }
