[workspace]
members = [
  "crates/neuro-core",
  "crates/neuro-eeg",
  "crates/neuro-meg",
  "crates/neuro-mri",
  "crates/neuro-store",
  "packages/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
